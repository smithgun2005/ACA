defaults:
  - /train/base
  - /train/data/tworoom5pct
  - _self_

hydra:
  searchpath:
    - file:///root/autodl-tmp/ACA/config

seed: 0
subdir: tworoom_5pct_inv_aca
artifacts:
  embedding_subset_size: 4096
trainer:
  max_epochs: 20
  devices: 1
  accelerator: gpu
  precision: bf16
  val_check_interval: 1.0
loader:
  batch_size: 256
optimizer:
  lr: 1e-4
  weight_decay: 1e-3
scheduler:
  enabled: false
wandb:
  enabled: false
validation_monitoring:
  enabled: false
data:
  dataset:
    num_steps: 2
    cache_dir: /root/autodl-tmp/sensorimotor-world-model/planning/data/external
  subset:
    episode_indices: /root/autodl-tmp/ACA/data/generated/tworoom_5pct/tworoom5pct_train_episodes.npy
wm:
  action_dim: 2
loss:
  sigreg:
    weight: 0.0
  inverse:
    weight: 0.1
  aca:
    weight: 1.0
    rho: 0.1
    margin: 0.0
    mode: gradient
    adversary: gradient
    noise_scale: 0.0
    encoder_scale: none
    online:
      enabled: false
    epoch_active:
      enabled: false
