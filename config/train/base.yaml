# @package _global_

seed: 3072
img_size: 224
patch_size: 14
encoder_scale: tiny

num_workers: 24

artifacts:
  save_resolved_config: true
  log_lightning_hparams: false
  use_external_callbacks: false
  save_model_object: false
  save_epoch_checkpoints: false



init_from_checkpoint: null






resume_from_checkpoint: null

trainer:
  max_epochs: 10
  devices: auto
  accelerator: gpu
  precision: bf16
  gradient_clip_val: 1.0
  val_check_interval: 500
  limit_val_batches: 10
  log_every_n_steps: 25

loader:
  batch_size: 256
  num_workers: ${num_workers}
  persistent_workers: true
  prefetch_factor: 4
  pin_memory: true

optimizer:
  type: AdamW
  lr: 1e-4
  weight_decay: 1e-3



scheduler:
  enabled: true

wandb:
  enabled: true
  log_config: false
  config:
    entity: pivashkov-mpi-is
    project: sensorimotor-world-model
    resume: never
    log_model: false

validation_monitoring:
  enabled: false
  probe_ridge_alpha: 1.0

wm:
  history_size: 1
  num_preds: 1
  embed_dim: 192
  grounded_coordinate: false
  grounded_coordinate_scale: 10.0

predictor:
  type: ar
  depth: 6
  heads: 16
  mlp_dim: 2048
  dim_head: 64
  dropout: 0.1
  emb_dropout: 0.0

inverse:
  hidden_dim: 256
  type: mlp
  blind_hidden_dim: 256

loss:
  action_normal:


    weight: 0.0
  random_aca:


    weight: 0.0
    rho: 1.0
    margin: 0.0
  gradient_penalty:


    weight: 0.0
    rho: 1.0
  si:



    weight: 0.0
    sigma: 0.5
    step_size: null
  masked_transition:


    pred_weight: 0.5
    action_weight: 0.5
  predictive_mask:


    enabled: false
    beta: 1.0
    num_masked_patches: 128
    temperature: 0.5
    alpha: 1.0
    hidden_dim: 256
    policy_lr: null
    base_seed: 0
  sigreg:
    weight: 0.0
    kwargs:
      knots: 17
      num_proj: 1024
  innov:


    weight: 0.0
    eps: 1.0e-6
  inverse:
    weight: 1.0
  aig:
    weight: 0.0
  rsi:
    weight: 0.0
    real_weight: 1.0
    separation_weight: 1.0
    catch_weight: 1.0
    margin: 0.01
  cai:
    weight: 0.0
    blind_hidden_dim: 256
    transition_hidden_dim: 256
  pdc:
    weight: 0.0
    jensen: false
    kwargs:
      k: 64
      seed: 0
      perp_weight: 0.0
  geo_pdc:
    weight: 0.0
    kwargs:
      k: 64
      scales: [1, 2, 4]
      seed: 0
  as_pdc:
    weight: 0.0
  delta_lift:
    weight: 0.0
    kwargs:
      k: 64
      tau: 1.0
      seed: 0
      pixel_eps: 1.0e-6
  aca:
    weight: 0.0



    mode: gradient
    rho: 1.0
    noise_scale: 0.0
    margin: 0.0


    encoder_scale: none


    max_steps: 20
    step_size: null
    grad_tol: 1.0e-5
    num_restarts: 4
    online:



      enabled: false
      rho: 1.0
      margin: 0.0
      top_fraction: 0.1
      max_samples_per_round: 8
      every_n_steps: 100
      replay_capacity: 10000
      replay_ratio: 0.25
      save_replay: true
    epoch_active:




      enabled: false
      rho: 0.2
      margin: 0.0
      top_fraction: 0.01


      collect_every_n_batches: 10
      max_samples_per_epoch: null

compile:
  enabled: false

data:
  dataset:

    num_steps: 2
  counterfactual:
    enabled: false
    path: null
    only: false

hydra:
  run:
    dir: ${oc.env:RUNS_ROOT,results}/${subdir}
  output_subdir: null
  job:
    chdir: false
